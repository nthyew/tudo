<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tủ Đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky header with 3 tabs; closet grid, outfit slot board, trip spot cards; cutout editor is a full-screen sheet. */
:root{
  --bg:#eef0f5; --surface:#ffffff; --tile:#f5f6fa; --ink:#141824; --muted:#5a6272; --line:#d8dce6;
  --accent:#2742e6; --accent-ink:#ffffff; --accent-soft:#e2e7ff;
  --good:#17744a; --warn:#a85f00; --bad:#b3261e;
  --ck1:#e9ebf1; --ck2:#f9fafc; --shadow:0 1px 2px rgba(20,24,36,.06),0 4px 14px rgba(20,24,36,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1118; --surface:#171b25; --tile:#1e2330; --ink:#eceff6; --muted:#9aa3b6; --line:#2a3142;
  --accent:#8196ff; --accent-ink:#0a0f2e; --accent-soft:#222a55;
  --good:#5fd093; --warn:#f0b04a; --bad:#ff8a80;
  --ck1:#262c3b; --ck2:#1b2030; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1118; --surface:#171b25; --tile:#1e2330; --ink:#eceff6; --muted:#9aa3b6; --line:#2a3142;
  --accent:#8196ff; --accent-ink:#0a0f2e; --accent-soft:#222a55;
  --good:#5fd093; --warn:#f0b04a; --bad:#ff8a80;
  --ck1:#262c3b; --ck2:#1b2030; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:12px 0 0;margin-bottom:16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px;color:var(--accent)}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{flex:1;min-width:0;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
h2{font-size:18px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.sec{margin-top:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .n{color:var(--muted);font-weight:500}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.5);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],select{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}

/* closet */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.item:hover{border-color:var(--muted)}
.item .pic{aspect-ratio:1/1;background:var(--tile);display:flex;align-items:center;justify-content:center;padding:10px}
.item img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.item .cap{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px;background:var(--surface)}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
.gap-note{margin-top:12px;font-size:13px;color:var(--warn);font-weight:600}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}

/* outfit board */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.locked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slot .lbl{display:flex;justify-content:space-between;align-items:center}
.slot .pic{aspect-ratio:1/1;background:var(--tile);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;border:0;width:100%;min-width:0;overflow:hidden}
.slot img{max-width:100%;max-height:100%;object-fit:contain}
.slot .ph{font-size:12px;color:var(--muted);text-align:center;padding:6px}
.slot .nm{font-size:12px;font-weight:600;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ctl{display:flex;gap:6px}
.slot .ctl .btn{flex:1;min-height:34px;padding:0 6px}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.score i{width:9px;height:9px;border-radius:50%;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs .t{width:52px;height:52px;border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center;padding:4px}
.thumbs img{max-width:100%;max-height:100%;object-fit:contain}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}

/* trip */
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.spot{display:flex;flex-direction:column;gap:12px}
.spot-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.spot-head{grid-template-columns:1fr 1fr}.spot-head .field:first-child{grid-column:1/-1}}
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.pack .p{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12px}
.pack .pic{aspect-ratio:1/1;background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px;margin-bottom:4px}
.pack img{max-width:100%;max-height:100%;object-fit:contain}
.cd{font-weight:700;color:var(--accent)}

/* flat-lay board: áo trên, quần dưới, giày cuối bên trái; khoác + phụ kiện bên phải */
.board{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;align-items:start}
.board .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.board .slot{border:0;background:none;padding:0;position:relative}
.board .slot.locked{box-shadow:none}
.board .slot.locked .pic{outline:2px solid var(--accent)}
.board .slot[data-s=top] .pic{aspect-ratio:1/.85}
.board .slot[data-s=bottom] .pic{aspect-ratio:1/1.35}
.board .slot[data-s=shoes] .pic{aspect-ratio:1/.5}
.board .slot[data-s=outer] .pic{aspect-ratio:1/.9}
.acc-cell{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.acc-cell .pic{aspect-ratio:1/.8;background:var(--tile);border-radius:10px;border:0;width:100%;padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.acc-cell img{max-width:100%;max-height:100%;object-fit:contain}
.acc-cell .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:18px}
.acc-multi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc-one{display:block}
.x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.over{outline:2px dashed var(--accent);outline-offset:-2px}
.spots{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.spot-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.col-photo,.col-board{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-photo{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--tile)}
.stage-photo .bg{width:100%;display:block}
.stage-photo.blank{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-style:dashed;padding:8px;text-align:center}
.stage-photo .ph{color:var(--muted);font-size:13px}
.show{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;min-height:200px}
.show-empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
.show-cols{display:flex;gap:10px;align-items:flex-start}
.show-cols .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){.show-cols{flex-direction:column;align-items:stretch}}
.st{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0}
.st .sp{background:var(--tile);border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.st img{max-width:100%;max-height:100%;object-fit:contain}
.st .nm{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-top .sp{aspect-ratio:1/.85}.t-bottom .sp{aspect-ratio:1/1.3}.t-shoes .sp{aspect-ratio:1/.5}.t-outer .sp{aspect-ratio:1/.9}.t-acc .sp{aspect-ratio:1/.8}
.quick{display:flex;flex-direction:column;gap:6px;min-width:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.qo{flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;max-width:190px;text-align:left}
.qo .thumbs{flex-wrap:nowrap}.qo .t{width:34px;height:34px;padding:2px;border-radius:8px}
.qo .qn{font-size:12px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker{display:flex;flex-direction:column;gap:10px}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.pk-wrap .pk-grid{max-height:300px}
#pk .pk-grid{max-height:none}
.pk-item{position:relative;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px;text-align:left;min-width:0}
.pk-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.pk-pic{aspect-ratio:1/1;background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px}
.pk-pic img{max-width:100%;max-height:100%;object-fit:contain}
.pk-nm{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

.brand .brandline{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .tt{font:inherit;font-weight:800;font-size:20px;letter-spacing:-.01em;background:transparent;border:0;border-bottom:2px dashed transparent;border-radius:0;padding:0;min-height:0;width:12ch;min-width:6ch;max-width:62vw;color:var(--ink)}
.brand .tt:hover{border-bottom-color:var(--line)}
.brand .tt:focus{outline:none;border-bottom:2px solid var(--accent)}
.saved-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sv-ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--tile);flex:none}
.sv-info{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px}
.sv-info strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-btns{display:flex;gap:6px;flex-wrap:wrap}
.card .spot-body{margin-top:0}
.batch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:12px}
.batch .btn{margin-left:auto}
.sel-ck{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.saved-row .sel-ck{align-self:center}
/* editor */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:1000px;margin:0 auto;padding-bottom:30px}
.ov-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0}
.ed-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.ed-body{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:200px;padding:0;
  background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/18px 18px}
#cut{max-width:100%;max-height:56vh;width:auto;height:auto;display:block;touch-action:none;cursor:crosshair}
.ring{position:absolute;border:2px solid var(--accent);border-radius:50%;pointer-events:none;display:none;background:rgba(255,255,255,.12)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg .chip{justify-content:center;border-radius:10px;min-height:40px}
.tools{display:flex;flex-direction:column;gap:12px}
.tools .btns{display:flex;gap:8px;flex-wrap:wrap}
.dlg-pic{aspect-ratio:1/1;max-width:220px;margin:0 auto;background:var(--tile);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:12px}
.dlg-pic img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{color-scheme:light}</style>
</head><body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 9a3 3 0 1 1 3 3c-1.7 0-3 .9-3 2.5V16M16 16 4 23.5a1.5 1.5 0 0 0 .8 2.8h22.4a1.5 1.5 0 0 0 .8-2.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brandline"><input class="tt" id="app-title" type="text" maxlength="40" value="Tủ Đồ của tôi" aria-label="Tên tủ đồ, bấm để sửa" spellcheck="false"><small id="count"></small></span>
      </div>
      <div class="row">
        <span class="sm muted" id="sync" role="status"></span>
        <button class="btn small" id="logout" type="button" hidden>Đăng xuất</button>
        <button class="btn small" id="bk-out" type="button">Sao lưu</button>
        <button class="btn small" id="bk-in" type="button">Khôi phục</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="tu-do" id="t-tu-do">Tủ đồ</button>
      <button class="tab" role="tab" data-v="phoi-do" id="t-phoi-do">Phối đồ</button>
      <button class="tab" role="tab" data-v="chuyen-di" id="t-chuyen-di">Chuyến đi</button>
    </div>
  </header>
  <main>
    <section id="v-tu-do"></section>
    <section id="v-phoi-do" hidden></section>
    <section id="v-chuyen-di" hidden></section>
  </main>
</div>

<!-- cutout editor -->
<div class="overlay" id="ed" hidden role="dialog" aria-label="Cắt đồ khỏi ảnh">
  <div class="ov-in">
    <div class="ov-bar">
      <button class="btn" id="ed-skip" type="button">Bỏ qua ảnh này</button>
      <strong id="ed-count" class="sm muted"></strong>
      <button class="btn primary" id="ed-save" type="button">Lưu vào tủ</button>
    </div>
    <div class="ed-body">
      <div>
        <div class="stage" id="stage"><canvas id="cut"></canvas><div class="ring" id="ring"></div></div>
        <p class="sm muted" id="ed-hint" style="margin:8px 0 0"></p>
      </div>
      <div class="tools">
        <div class="field"><span class="lbl">Công cụ</span>
          <div class="seg" id="modes">
            <button class="chip" data-m="wandOut" type="button" aria-pressed="true">Chạm xoá vùng nền</button>
            <button class="chip" data-m="wandIn" type="button" aria-pressed="false">Chạm giữ lại vùng</button>
            <button class="chip" data-m="erase" type="button" aria-pressed="false">Tẩy bằng cọ</button>
            <button class="chip" data-m="restore" type="button" aria-pressed="false">Vẽ lại bằng cọ</button>
          </div>
        </div>
        <div class="field"><label for="tol">Độ nhạy màu nền: <span id="tol-v"></span></label><input type="range" id="tol" min="8" max="110" value="36"></div>
        <div class="field"><label for="brush">Cỡ cọ: <span id="brush-v"></span></label><input type="range" id="brush" min="4" max="60" value="18"></div>
        <div class="btns">
          <button class="btn small" id="b-auto" type="button">Cắt tự động lại</button>
          <button class="btn small" id="b-big" type="button">Chỉ giữ vật lớn nhất</button>
          <button class="btn small" id="b-erode" type="button">Thu viền 1px</button>
          <button class="btn small" id="b-undo" type="button">Hoàn tác</button>
        </div>
        <div id="meta"></div>
      </div>
    </div>
  </div>
</div>

<!-- item details -->
<div class="overlay" id="dlg" hidden role="dialog" aria-label="Chi tiết món đồ">
  <div class="ov-in" style="max-width:520px">
    <div class="ov-bar">
      <button class="btn" id="dlg-close" type="button">Đóng</button>

/* ---------- colour logic ---------- */
function hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let hh=0,s=0;

    hh=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hh*=60}
  return [hh,s,l]}
function colorName(r,g,b){const [hh,s,l]=hsl(r,g,b);
  if(l<.14)return'Đen';
  if(s<.12)return l>.86?'Trắng':'Xám';
  if(hh>=15&&hh<48){if(l>.62&&s<.65)return'Be/Kem';if(l<.42)return'Nâu';return hh<36?'Cam':'Vàng'}
  if(hh>=48&&hh<70){if(l>.7&&s<.55)return'Be/Kem';if(l<.36)return'Nâu';return'Vàng'}
  if(hh>=70&&hh<165)return'Xanh lá';
  if(hh>=165&&hh<195)return'Xanh ngọc';
  if(hh>=195&&hh<255)return l<.3?'Navy':'Xanh dương';
  if(hh>=255&&hh<300)return'Tím';
  if(hh>=300&&hh<345)return'Hồng';
  if(l>.7)return'Hồng';
  return l<.3&&s<.6?'Nâu':'Đỏ'}
const hd=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function harmony(items){
  const hs=[];items.forEach(i=>{if(NEUTRAL.has(i.cname)||!(i.cname in HUE))return;const x=HUE[i.cname];if(!hs.some(y=>hd(y,x)<35))hs.push(x)});
  if(!hs.length)return 82;if(hs.length===1)return 92;
  if(hs.length===2){const d=hd(hs[0],hs[1]);return d>=150?86:d<=70?80:58}
  return 35}

    if(c.weather==='hot'){if(i.warm===1)s+=4;if(i.warm===3)s-=14}
    if(c.weather==='cold'){if(i.warm===3)s+=5;if(i.warm===1&&body)s-=8}
    if(c.weather==='mild'&&i.warm===2)s+=2;
  });

/* ---------- xuất ảnh ---------- */
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
function fitDraw(ctx,im,x,y,w,hh){const r=Math.min(w/im.width,hh/im.height),dw=im.width*r,dh=im.height*r;ctx.drawImage(im,x+(w-dw)/2,y+(hh-dh)/2,dw,dh)}
async function composeImage(a){
  const o=a.outfit,L=['top','bottom','shoes'].map(s=>({s,it:byId(o[s])})).filter(x=>x.it),outer=byId(o.outer),accs=(o.acc||[]).map(byId).filter(Boolean);
  if(!a.photo&&!L.length&&!outer&&!accs.length)return null;
  const colW=330,gap=24,pad=48,titleH=104,hs={top:290,bottom:410,shoes:160};
  const hasL=L.length>0,hasR=!!outer||accs.length>0;
  const leftH=L.length?L.reduce((s,x)=>s+hs[x.s],0)+gap*(L.length-1):0;
  const multi=accs.length>1,cell=multi?(colW-gap)/2:colW*.8,rows=accs.length?(multi?Math.ceil(accs.length/2):1):0;
  const accH=rows?rows*cell+(rows-1)*gap:0,rightH=(outer?280:0)+(outer&&accs.length?gap:0)+accH;
  const boardW=(hasL?colW:0)+(hasR?colW:0)+(hasL&&hasR?gap:0),boardH=Math.max(leftH,rightH);
  let img=null,pw=0,ph=0;
  if(a.photo){img=await loadImg(a.photo);const s=Math.min(560/img.width,Math.max(boardH,640)/img.height);pw=Math.round(img.width*s);ph=Math.round(img.height*s)}
  const bodyW=pw+(pw&&boardW?pad:0)+boardW,bodyH=Math.max(ph,boardH);
  const W=Math.max(720,bodyW+pad*2),H=bodyH+pad*2+titleH;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.textBaseline='top';
  x.fillStyle='#141824';x.font='700 38px "Be Vietnam Pro",system-ui,sans-serif';x.fillText(a.title||'Bộ đồ',pad,pad);
  if(a.sub){x.fillStyle='#5a6272';x.font='500 24px "Be Vietnam Pro",system-ui,sans-serif';x.fillText(a.sub,pad,pad+54)}
  const x0=Math.round((W-bodyW)/2),y0=pad+titleH;
  if(img)x.drawImage(img,x0,y0,pw,ph);
  const bx=x0+pw+(pw&&boardW?pad:0),draw=async(it,px,py,w,hh)=>fitDraw(x,await loadImg(it.img),px,py,w,hh);
  if(hasL){let y=y0;for(const l of L){await draw(l.it,bx,y,colW,hs[l.s]);y+=hs[l.s]+gap}}
  if(hasR){const rx=bx+(hasL?colW+gap:0);let y=y0;
    if(outer){await draw(outer,rx,y,colW,280);y+=280+gap}
    for(let i=0;i<accs.length;i++){const col=multi?i%2:0,row=multi?Math.floor(i/2):0;
      await draw(accs[i],rx+col*(cell+gap)+(multi?0:(colW-cell)/2),y+row*(cell+gap),cell,cell)}}
  return c}
const safeName=n=>((n||'bo-do').replace(/[\\/:*?"<>|]+/g,'').trim()||'bo-do').slice(0,80);
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
async function saveBlob(fn,blob){
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:fn,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;throw e}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
async function exportOutfit(a,name){
  let c;try{c=await composeImage(a)}catch(e){toast('Không tạo được ảnh');return}
  if(!c){toast('Chưa có gì để xuất');return}
  const blob=await toBlob(c);if(!blob){toast('Không tạo được ảnh');return}

async function exportMany(list,mode){
  toast('Đang tạo ảnh…');
  const cs=[];
  for(const x of list){try{const c=await composeImage(x.arg);if(c)cs.push({c,name:x.name})}catch(e){}}
  if(!cs.length){toast('Không có gì để xuất');return}
  try{
    if(mode==='zip'&&window.JSZip){
      const z=new JSZip(),used=new Set();
      for(const x of cs){const n=safeName(x.name);let k=n,i=2;while(used.has(k))k=n+' ('+(i++)+')';used.add(k);z.file(k+'.png',await toBlob(x.c))}
      const blob=await z.generateAsync({type:'blob'});
      if(await saveBlob('phoi-do-'+cs.length+'-anh.zip',blob))toast('Đã xuất '+cs.length+' ảnh trong file zip')}
    else{
      const cols=Math.min(2,cs.length),cw=900,g=28,rows=[];
      for(let i=0;i<cs.length;i+=cols)rows.push(cs.slice(i,i+cols));
      const hs=rows.map(r=>Math.max(...r.map(x=>Math.round(x.c.height*cw/x.c.width))));
      const W=cols*cw+(cols+1)*g,H=hs.reduce((a,b)=>a+b+g,g);
      const out=document.createElement('canvas');out.width=W;out.height=H;const x=out.getContext('2d');
      x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
      let y=g;rows.forEach((r,ri)=>{r.forEach((it,ci)=>x.drawImage(it.c,g+ci*(cw+g),y,cw,Math.round(it.c.height*cw/it.c.width)));y+=hs[ri]+g});
      const blob=await toBlob(out);if(!blob)throw 0;
      if(await saveBlob('phoi-do-gop-'+cs.length+'-bo.png',blob))toast('Đã xuất 1 ảnh gộp '+cs.length+' kết quả')}
  }catch(e){toast('Chưa xuất được, thử chọn ít kết quả hơn')}}

function flood(seeds,ref,t,val){

  const ok=i=>{const j=i*4,a=o[j]-ref[0],b=o[j+1]-ref[1],c=o[j+2]-ref[2];return a*a+b*b+c*c<=t2};
  for(const s of seeds)if(!vis[s]&&ok(s)){vis[s]=1;st[sp++]=s}
  while(sp){const i=st[--sp];mask[i]=val;const x=i%W;let k;
    if(x>0){k=i-1;if(!vis[k]&&ok(k)){vis[k]=1;st[sp++]=k}}
    if(x<W-1){k=i+1;if(!vis[k]&&ok(k)){vis[k]=1;st[sp++]=k}}
    if(i>=W){k=i-W;if(!vis[k]&&ok(k)){vis[k]=1;st[sp++]=k}}
    if(i<n-W){k=i+W;if(!vis[k]&&ok(k)){vis[k]=1;st[sp++]=k}}}}
function borderRef(){
  const o=orig.data,R=[],G=[],B=[];
  const add=i=>{R.push(o[i*4]);G.push(o[i*4+1]);B.push(o[i*4+2])};
  for(let x=0;x<W;x+=3){add(x);add((H-1)*W+x)}
  for(let y=0;y<H;y+=3){add(y*W);add(y*W+W-1)}
  const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]};
  return [med(R),med(G),med(B)]}
function cleanup(ratio){
  const n=W*H,lab=new Int32Array(n),st=new Int32Array(n),sizes=[0];let id=0,mx=0;
  for(let s=0;s<n;s++){
    if(!mask[s]||lab[s])continue;id++;let sp=0,sz=0;lab[s]=id;st[sp++]=s;
    while(sp){const i=st[--sp];sz++;const x=i%W;let k;
      if(x>0){k=i-1;if(mask[k]&&!lab[k]){lab[k]=id;st[sp++]=k}}
      if(x<W-1){k=i+1;if(mask[k]&&!lab[k]){lab[k]=id;st[sp++]=k}}
      if(i>=W){k=i-W;if(mask[k]&&!lab[k]){lab[k]=id;st[sp++]=k}}
      if(i<n-W){k=i+W;if(mask[k]&&!lab[k]){lab[k]=id;st[sp++]=k}}}
    sizes[id]=sz;if(sz>mx)mx=sz}
  for(let i=0;i<n;i++)if(mask[i]&&sizes[lab[i]]<mx*ratio)mask[i]=0}
function autoCut(){
  mask.fill(255);
  const seeds=[];for(let x=0;x<W;x++){seeds.push(x,(H-1)*W+x)}for(let y=0;y<H;y++){seeds.push(y*W,y*W+W-1)}
  flood(seeds,borderRef(),tol,0);cleanup(.04);undo=[];edited=false;render()}
function erode(){
  pushUndo();const src=mask.slice();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;
    if(!src[i])continue;
    if(x===0||y===0||x===W-1||y===H-1||!src[i-1]||!src[i+1]||!src[i-W]||!src[i+W])mask[i]=0}
  edited=true;render()}
function brushAt(x,y,val){
  const r=brush,x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-r)),y1=Math.min(H-1,Math.ceil(y+r));
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)if((xx-x)*(xx-x)+(yy-y)*(yy-y)<=r*r)mask[yy*W+xx]=val}
function pt(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function moveRing(e){
  if(mode!=='erase'&&mode!=='restore'){$('#ring').style.display='none';return}
  const r=cv.getBoundingClientRect(),s=$('#stage').getBoundingClientRect(),d=brush*2*r.width/W,rg=$('#ring');
  rg.style.display='block';rg.style.width=rg.style.height=d+'px';rg.style.left=(e.clientX-s.left-d/2)+'px';rg.style.top=(e.clientY-s.top-d/2)+'px'}
cv.addEventListener('pointerdown',e=>{
  if(!orig)return;e.preventDefault();const [x,y]=pt(e);
  if(mode==='wandOut'||mode==='wandIn'){
    pushUndo();const xi=clamp(Math.round(x),0,W-1),yi=clamp(Math.round(y),0,H-1),o=orig.data;
    let r=0,g=0,b=0,c=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=clamp(xi+dx,0,W-1),yy=clamp(yi+dy,0,H-1),j=(yy*W+xx)*4;r+=o[j];g+=o[j+1];b+=o[j+2];c++}
    flood([yi*W+xi],[r/c,g/c,b/c],tol,mode==='wandOut'?0:255);edited=true;render();return}
  pushUndo();drawing=true;last=[x,y];cv.setPointerCapture(e.pointerId);
  const v=mode==='erase'?0:255;brushAt(x,y,v);edited=true;sched();moveRing(e)});
cv.addEventListener('pointermove',e=>{
  moveRing(e);if(!drawing)return;const [x,y]=pt(e),v=mode==='erase'?0:255;
  const dx=x-last[0],dy=y-last[1],steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(brush/2)));
  for(let i=1;i<=steps;i++)brushAt(last[0]+dx*i/steps,last[1]+dy*i/steps,v);
  last=[x,y];sched()});
const endDraw=()=>{drawing=false};
cv.addEventListener('pointerup',endDraw);cv.addEventListener('pointercancel',endDraw);
cv.addEventListener('pointerleave',()=>{$('#ring').style.display='none'});
$('#b-auto').onclick=()=>{autoCut()};
$('#b-big').onclick=()=>{pushUndo();cleanup(1);edited=true;render()};
$('#b-erode').onclick=erode;
$('#b-undo').onclick=()=>{if(undo.length){mask=undo.pop();render()}else toast('Không còn bước để hoàn tác')};

async function loadFile(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)})}
  const iw=bmp.width||bmp.naturalWidth,ih=bmp.height||bmp.naturalHeight,s=Math.min(1,760/Math.max(iw,ih));
  W=Math.max(1,Math.round(iw*s));H=Math.max(1,Math.round(ih*s));cv.width=W;cv.height=H;
  cx.clearRect(0,0,W,H);cx.drawImage(bmp,0,0,W,H);
  orig=cx.getImageData(0,0,W,H);out=cx.createImageData(W,H);mask=new Uint8Array(W*H).fill(255);undo=[];edited=false;
  autoCut();
  // dominant colour of kept pixels
  const bins=new Map(),o=orig.data;
  for(let i=0;i<W*H;i+=3){if(!mask[i])continue;const j=i*4,k=((o[j]>>4)<<8)|((o[j+1]>>4)<<4)|(o[j+2]>>4);
    let a=bins.get(k);if(!a){a=[0,0,0,0];bins.set(k,a)}a[0]+=o[j];a[1]+=o[j+1];a[2]+=o[j+2];a[3]++}
  let top=null;bins.forEach(a=>{if(!top||a[3]>top[3])top=a});
  const cn=top?colorName(top[0]/top[3],top[1]/top[3],top[2]/top[3]):'Xám';
  eMeta={name:'',cat:'ao',cname:cn,warm:null,auto:true,add:null};eMeta.name=catName(eMeta.cat)+' '+cn.toLowerCase();
  metaForm($('#meta'),eMeta);
}
async function nextFile(){
  if(!queue.length){$('#ed').hidden=true;document.body.style.overflow='';renderAll();return}
  $('#ed-count').textContent='Ảnh '+(qTotal-queue.length+1)+' / '+qTotal;
  const f=queue.shift();
  try{await loadFile(f);setMode('wandOut');$('#ed').scrollTop=0}catch(e){toast('Không đọc được một ảnh, đã bỏ qua');await nextFile()}}
function buildCut(MAXD,Q){MAXD=MAXD||560;Q=Q||.92;
  const n=W*H,a=new Float32Array(n),b=new Float32Array(n);
  for(let i=0;i<n;i++)a[i]=mask[i]/255;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0,c=0;
    for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;
      for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=W)continue;s+=a[yy*W+xx];c++}}
    b[y*W+x]=s/c}
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;const ox=oc.getContext('2d'),id=ox.createImageData(W,H),o=orig.data;
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let i=0;i<n;i++){const j=i*4,v=clamp((b[i]-.25)/.5,0,1),al=Math.round(v*o[j+3]);
    id.data[j]=o[j];id.data[j+1]=o[j+1];id.data[j+2]=o[j+2];id.data[j+3]=al;
    if(al>30){const x=i%W,y=(i/W)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;
  ox.putImageData(id,0,0);
  const p=4;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(W-1,x1+p);y1=Math.min(H-1,y1+p);
  const cw=x1-x0+1,ch=y1-y0+1,s=Math.min(1,MAXD/Math.max(cw,ch)),c2=document.createElement('canvas');
  c2.width=Math.max(1,Math.round(cw*s));c2.height=Math.max(1,Math.round(ch*s));
  const x2=c2.getContext('2d');x2.imageSmoothingQuality='high';x2.drawImage(oc,x0,y0,cw,ch,0,0,c2.width,c2.height);
  return c2.toDataURL('image/webp',Q)}
$('#ed-save').onclick=async()=>{
  let url=buildCut();if(!url){toast('Chưa còn vật thể nào, hãy vẽ lại phần cần giữ');return}
  for(const [d,q] of [[480,.85],[400,.78],[320,.7]]){if(url.length<=230000)break;url=buildCut(d,q)}
  const it={id:uid(),name:eMeta.name.trim()||catName(eMeta.cat),cat:eMeta.cat,cname:eMeta.cname,warm:eMeta.warm,img:url,t:Date.now()};
  state.items.unshift(it);await saveItem(it);toast('Đã thêm "'+it.name+'"');await nextFile()};
$('#ed-skip').onclick=()=>nextFile();
$('#file').onchange=e=>{
  const fs=[...e.target.files].filter(f=>f.type.startsWith('image/'));e.target.value='';if(!fs.length)return;
  queue=fs;qTotal=fs.length;$('#ed').hidden=false;document.body.style.overflow='hidden';nextFile()};

/* ---------- sample items (drawn shapes, marked as samples) ---------- */
function shade(hex,k){const n=parseInt(hex.slice(1),16);const c=v=>clamp(Math.round(v*k),0,255);return'rgb('+c(n>>16)+','+c((n>>8)&255)+','+c(n&255)+')'}
const SHAPES={
  tee:'M90 40L130 28Q150 52 170 28L210 40L256 92L224 118L205 100L205 300L95 300L95 100L76 118L44 92Z',
  shirt:'M85 38L128 26L150 48L172 26L215 38L260 100L228 124L208 104L208 304L92 304L92 104L72 124L40 100Z',
  pants:'M92 28H208L228 312H166L150 122L134 312H72Z',
  dress:'M112 28L128 28Q150 62 172 28L188 28L200 122L258 312H42L100 122Z',
  jacket:'M78 36L124 24L150 46L176 24L222 36L264 272L232 282L214 144L210 308L90 308L86 144L68 282L36 272Z',
  shoe:'M36 206Q36 148 92 138L132 150Q164 176 214 182Q264 188 266 218L266 240H36Z',
  bag:'M72 118H228L246 290H54Z'};
function drawSample(shape,hex,extra){
  const c=document.createElement('canvas');c.width=300;c.height=340;const x=c.getContext('2d');
  if(shape==='hat'){x.fillStyle=hex;x.strokeStyle=shade(hex,.72);x.lineWidth=4;x.beginPath();x.moveTo(62,190);x.quadraticCurveTo(62,96,150,90);x.quadraticCurveTo(238,96,238,190);x.closePath();x.fill();x.stroke();
    x.fillStyle=shade(hex,.86);x.beginPath();x.moveTo(40,190);x.quadraticCurveTo(150,170,262,190);x.quadraticCurveTo(262,218,150,218);x.quadraticCurveTo(40,218,40,190);x.fill();x.stroke();return c.toDataURL('image/png')}
  if(shape==='ear'){for(const px of [100,200]){x.strokeStyle=hex;x.lineWidth=9;x.beginPath();x.arc(px,140,32,0,7);x.stroke();x.fillStyle=shade(hex,.85);x.beginPath();x.arc(px,182,11,0,7);x.fill()}return c.toDataURL('image/png')}
  if(shape==='bag'){x.strokeStyle=shade(hex,.7);x.lineWidth=12;x.beginPath();x.arc(150,118,52,Math.PI,0);x.stroke()}
  const p=new Path2D(SHAPES[shape]);x.fillStyle=hex;x.fill(p);x.lineWidth=4;x.strokeStyle=shade(hex,.72);x.lineJoin='round';x.stroke(p);
  x.strokeStyle=shade(hex,.82);x.lineWidth=3;
  if(shape==='jacket'||shape==='shirt'){x.beginPath();x.moveTo(150,48);x.lineTo(150,shape==='jacket'?308:304);x.stroke()}
  if(shape==='pants'){x.beginPath();x.moveTo(150,122);x.lineTo(150,60);x.stroke()}
  if(shape==='shoe'){x.fillStyle=extra||'#f4f4f2';x.fillRect(36,232,230,16);x.strokeStyle=shade(extra||'#f4f4f2',.7);x.strokeRect(36,232,230,16)}
  return c.toDataURL('image/png')}
const SAMPLES=[
  ['Áo thun trắng','ao','tee','#f1f1ee',1],['Áo thun đen','ao','tee','#1f1f24',1],['Sơ mi xanh dương','ao','shirt','#4a82e6',1],['Áo thun hồng','ao','tee','#f0a9bf',1],
  ['Quần be','quan','pants','#d9c7a5',2],['Quần jean xanh','quan','pants','#3d5a96',2],['Quần đen','quan','pants','#25262b',2],
  ['Đầm vàng','dam','dress','#f0c643',1],['Áo khoác be','khoac','jacket','#cdb994',3],['Áo khoác đen','khoac','jacket','#2a2b31',3],
  ['Giày thể thao trắng','giay','shoe','#f4f4f2',2],['Giày nâu','giay','shoe','#7a4f30',2],['Túi xanh lá','tui','bag','#4c9a58',2],['Mũ nồi be','mu','hat','#d6bf94',2],['Khuyên tai vàng','trangsuc','ear','#e0b85a',2]];
async function addSamples(){
  for(const [name,cat,shape,hex,warm] of SAMPLES){
    const n=parseInt(hex.slice(1),16),cn=colorName(n>>16,(n>>8)&255,n&255);
    const it={id:uid(),name,cat,cname:cn,warm,img:drawSample(shape,hex,cat==='giay'?'#e9e9e4':null),sample:true,t:Date.now()};
    state.items.push(it);await saveItem(it)}
  renderAll();toast('Đã thêm '+SAMPLES.length+' món mẫu')}
async function removeSamples(){
  const ids=new Set(state.items.filter(i=>i.sample).map(i=>i.id));
  for(const id of ids)await delItem(id);
  state.items=state.items.filter(i=>!ids.has(i.id));
  purgeItems(ids);renderAll();toast('Đã xoá đồ mẫu')}

/* ---------- backup ---------- */
$('#bk-out').onclick=async()=>{
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('Chế độ xem này không cho tải file');return}
  try{await dl.save({filename:'tu-do-sao-luu.json',data:JSON.stringify({v:2,items:state.items,outfits:state.outfits,trip:state.trip,custom:state.custom,settings:state.settings})});toast('Đã lưu file sao lưu')}
  catch(e){if(!e||e.code!=='declined')toast('Chưa lưu được file sao lưu')}};
$('#bk-in').onclick=()=>$('#file-json').click();
$('#file-json').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.items))throw 0;
    const have=new Set(state.items.map(i=>i.id));let add=0;
    for(const it of d.items){if(!it||!it.id||!it.img||have.has(it.id))continue;state.items.push(it);await saveItem(it);add++}
    if(Array.isArray(d.outfits)){const oh=new Set(state.outfits.map(o=>o.id));d.outfits.forEach(o=>{if(o&&o.id&&!oh.has(o.id))state.outfits.push(o)})}
    if(d.custom){const C=state.custom,D=d.custom;
      (D.cats||[]).forEach(c=>{if(c&&c.id&&!C.cats.some(x=>x.id===c.id))C.cats.push(c)});
      (D.colors||[]).forEach(c=>{if(c&&c.name&&!C.colors.some(x=>x.name===c.name))C.colors.push(c)});
      (D.warms||[]).forEach(w=>{if(w&&!C.warms.includes(w))C.warms.push(w)})}
    if(d.trip&&!state.trip.spots.length&&!state.trip.name){state.trip=Object.assign(TRIP0(),d.trip);state.trip.spots.forEach(sp=>{if(sp.photo)savePhoto(sp.id,sp.photo)})}
    if(d.settings&&d.settings.title&&state.settings.title==='Tủ Đồ của tôi')state.settings.title=d.settings.title;
    await migrateAll();saveKV();syncTitle();renderAll();toast('Đã khôi phục '+add+' món')}
  catch(err){toast('File sao lưu không hợp lệ')}};

/* ---------- migration (cấu trúc cũ -> phụ kiện nhiều món) ---------- */
async function migrateAll(){
  const before=JSON.stringify([state.mix.outfit,state.outfits,state.trip.spots.map(s=>s.outfit)]);
  const fix=o=>{if(!o)return;const a=Array.isArray(o.acc)?o.acc.slice():(o.acc?[o.acc]:[]);
    ['hat','jewel','bag'].forEach(k=>{if(o[k])a.push(o[k]);delete o[k]});o.acc=[...new Set(a)]};
  fix(state.mix.outfit);state.outfits.forEach(x=>{x.slots=x.slots||{};fix(x.slots)});
  state.trip.spots.forEach(sp=>{sp.outfit=sp.outfit||{};fix(sp.outfit);delete sp.free;if(sp.photo===undefined)sp.photo=null});
  if(JSON.stringify([state.mix.outfit,state.outfits,state.trip.spots.map(s=>s.outfit)])!==before)saveKV()}

/* ---------- boot ---------- */
function syncTitle(){const t=$('#app-title');t.value=state.settings.title;t.style.width=(Math.max(6,t.value.length)+1)+'ch'}
$('#app-title').addEventListener('input',e=>{state.settings.title=e.target.value;e.target.style.width=(Math.max(6,e.target.value.length)+1)+'ch';saveKV()});
(async function(){
  renderAll();syncTitle();
  await initStore();
  await migrateAll();
  syncTitle();renderAll();setSync();
})();
